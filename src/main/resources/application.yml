server:
  # Web 服务器端口
  port: 9001
  shutdown: graceful
  tomcat:
    # Tomcat 从接收到一个来自客户端的 TCP 连接到实际接收到 HTTP 请求所能等待的时间限制
    connection-timeout: 2s
    # 等待新的 HTTP 请求时连接保持打开状态的时长
    keep-alive-timeout: 15s
    threads:
      # 请求处理线程的最大数量
      max: 50
      # 保持始终运行的最小线程数量
      min-spare: 5

spring:
  application:
    # 应用的名称，配置服务器会使用它来过滤配置
    name: catalog-service
  lifecycle:
    timeout-per-shutdown-phase: 15s
  datasource:
    # 具有访问指定数据库权限的用户的凭证以及用来标识我们想要与那个数据库建立连接的 JDBC URL
    username: user
    password: password
    url: jdbc:postgresql://localhost:5432/polardb_catalog
    hikari:
      # 从池中获取连接的最大等待时间 (毫秒)
      connection-timeout: 2000
      # HikariCP 在池中保留的最大连接数
      maximum-pool-size: 5
  config:
    # 如果配置服务器可用的话，会在这里导入配置数据
    import: "optional:configserver:"
  cloud:
    config:
      # 配置服务器的 URL
      uri: http://localhost:8888
      # 等待连接配置服务器的超时时间 (毫秒)
      request-connect-timeout: 5000
      # 等待从配置服务器读取配置数据的超时时间 (毫秒)
      request-read-timeout: 5000
      # 将连接至配置服务器的失败设置为致命错误
      fail-fast: true
      retry:
        # 最大的尝试次数
        max-attempts: 6
        # Backoff 的初始重试间隔 (毫秒)
        initial-interval: 1000
        # Backoff 的最大重试间隔 (毫秒)
        max-interval: 2000
        # 计算下一次间隔的乘数
        multiplier: 1.1

management:
  endpoints:
    web:
      exposure:
        # 通过 HTTP 对外暴露 /actuator/refresh 端点
        include: refresh

# 为自定义属性定义值
polar:
  greeting: Welcome to the local book catalog!
